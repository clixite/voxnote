name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test, build
    env:
      # Valeurs de test PUBLIQUES (committées volontairement, aucune valeur
      # réelle) : le mot de passe en clair correspondant au hash ci-dessous
      # est `phrase-de-passe-de-test-voxnote`, utilisé par les e2e de connexion.
      AUTH_SECRET: voxnote-public-ci-test-secret-do-not-use-in-prod
      APP_PASSWORD_HASH: "$2b$10$UTeiF0JzNamfFO7B6k4ENeL6CTnKPPOJ4OiZKrjictv.0IDUmt6Yq"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    name: E2E tests
    needs: checks
    env:
      # Valeurs de test PUBLIQUES (committées volontairement, aucune valeur
      # réelle) : le mot de passe en clair correspondant au hash ci-dessous
      # est `phrase-de-passe-de-test-voxnote`, utilisé par les e2e de connexion.
      AUTH_SECRET: voxnote-public-ci-test-secret-do-not-use-in-prod
      APP_PASSWORD_HASH: "$2b$10$UTeiF0JzNamfFO7B6k4ENeL6CTnKPPOJ4OiZKrjictv.0IDUmt6Yq"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
